name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: ./dist/checksums.txt

  smoke:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/nyxon-tech/claude-switcher/main/install.ps1 | iex
          & "$env:LOCALAPPDATA\Programs\claude-switcher\claude-switcher.exe" version
      - if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/nyxon-tech/claude-switcher/main/install.sh | sh
          ~/.local/bin/claude-switcher version --short | grep "${GITHUB_REF_NAME#v}"
